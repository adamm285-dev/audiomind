name: Build Desktop Releases (Windows & macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller
      - name: Build AudioMind Windows bundle
        run: pyinstaller --noconfirm desktop/AudioMind.spec
      - name: Package Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/AudioMind/* -DestinationPath AudioMind-Windows-Desktop.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AudioMind-Windows-Desktop
          path: AudioMind-Windows-Desktop.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller
      - name: Build AudioMind.app
        run: pyinstaller --noconfirm desktop/AudioMind.spec
      - name: Create macOS DMG
        run: |
          mkdir -p dmg_stage
          cp -R dist/AudioMind.app dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "AudioMind" -srcfolder dmg_stage -ov -format UDZO AudioMind-macOS-Desktop.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: AudioMind-macOS-Desktop
          path: AudioMind-macOS-Desktop.dmg

  publish-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AudioMind-Windows-Desktop/AudioMind-Windows-Desktop.zip
            AudioMind-macOS-Desktop/AudioMind-macOS-Desktop.dmg
